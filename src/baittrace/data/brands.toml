# Commonly impersonated brands.
#
# This is data, not code, so coverage can be extended by pull request without
# touching detection logic. Two fields matter and they do different jobs:
#
#   aliases  strings a lookalike domain would try to resemble. Compared by
#            confusable skeleton and edit distance, so include the forms an
#            attacker would register, not marketing names.
#   domains  domains the brand legitimately sends from. A hit on an alias is
#            only a finding when the sending domain is NOT in this list, so an
#            incomplete domains list produces false positives. When in doubt,
#            include the domain.
#
# Add your own employer, executives and internal domains through user config
# rather than here; see docs/rules/IDN003.md.

[[brand]]
name = "Microsoft"
aliases = ["microsoft", "office365", "outlook", "onedrive", "sharepoint", "azure"]
domains = [
    "microsoft.com", "microsoftonline.com", "office.com", "office365.com",
    "outlook.com", "live.com", "msn.com", "onedrive.com", "sharepoint.com",
    "azure.com", "windows.com", "skype.com", "bing.com",
]

[[brand]]
name = "Google"
